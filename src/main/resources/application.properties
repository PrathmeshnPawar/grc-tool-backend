spring.application.name=arihant-grc-tool
server.port=8085
spring.config.import=optional:file:.env[.properties]
# ===============================
# Datasource & Connection Pool
# ===============================
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
# Senior Tip: Hikari is the default, but explicitly setting a timeout is wise
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Flyway
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=true

# ===============================
# Logging (Corrected for Windows/Ubuntu flexibility)
# ===============================
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=ERROR

# Use a relative path for Windows; override in Docker/Ubuntu via Environment Variable
logging.file.name=arihant-grc-tool.log
logging.file.path=${LOG_PATH:logs/}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# ===============================
# Security
# ===============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email


#================================
# HEALTH CHECK
#================================
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health

# Show SQL in console
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Catch Async errors
logging.level.org.springframework.scheduling=DEBUG